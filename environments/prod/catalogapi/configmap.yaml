apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-api-config
  namespace: prod
data:
  ASPNETCORE_URLS: http://+:8080
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__CatalogDB: Host=catalogdb;Port=5432;Database=catalogdb;Username=postgres;Pooling=false;Include Error Detail=true
  ConnectionStrings__EventBus: amqp://eshop:eshop@eventbus:5672/
  CatalogOptions__UseCustomizationData: "false"

