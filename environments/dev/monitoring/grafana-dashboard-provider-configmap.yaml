apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-grafana-dashboard-provider
  namespace: dev
data:
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
